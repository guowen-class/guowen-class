<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="claude:viewport-fit-sides" content="cover">
<title>國文小精靈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面概念：貼紙風單欄。粗描邊加硬陰影的圓潤元件，手機上按鈕夠大，題號像一排泡泡。 */
:root{
  --bg:#fff3f8;
  --dot:#ffdceb;
  --card:#ffffff;
  --ink:#3b2f4a;
  --dim:#7a6a8c;
  --line:#3b2f4a;
  --pink:#ff7eb6;
  --mint:#5fd6c0;
  --sun:#ffd35c;
  --sky:#7ab8ff;
  --on-accent:#3b2f4a;
  --ok-bg:#d9f7ee;
  --no-bg:#ffdce8;
  --good:#0f7a60;
  --miss:#c4245f;
  --input-bg:#fff9fc;
  --font-display:"Huninn","Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#241a35;--dot:#2e2142;--card:#34264b;--ink:#fff1f8;--dim:#c9b9dd;--line:#0f0818;
    --pink:#ff8fc2;--mint:#6fe0cb;--sun:#ffd96e;--sky:#8cc4ff;--on-accent:#2a1f3a;
    --ok-bg:#1f4a42;--no-bg:#5a2a43;--good:#7ff0cf;--miss:#ff9fc0;--input-bg:#2a1e3e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241a35;--dot:#2e2142;--card:#34264b;--ink:#fff1f8;--dim:#c9b9dd;--line:#0f0818;
  --pink:#ff8fc2;--mint:#6fe0cb;--sun:#ffd96e;--sky:#8cc4ff;--on-accent:#2a1f3a;
  --ok-bg:#1f4a42;--no-bg:#5a2a43;--good:#7ff0cf;--miss:#ff9fc0;--input-bg:#2a1e3e;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle,var(--dot) 2px,transparent 2.6px) 0 0/28px 28px,var(--bg);
  color:var(--ink);
  font:16px/1.75 var(--font-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.w{max-width:720px;margin:0 auto}

h1{margin:0;display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-size:1.9rem;font-weight:400;line-height:1.25;color:var(--ink);text-shadow:2px 2px 0 var(--pink);text-wrap:balance}
.mascot{position:relative;flex:none;width:52px;height:52px;border-radius:50% 50% 46% 46%;background:var(--sun);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);animation:hop 1.6s ease-in-out infinite}
.mascot i{position:absolute;top:18px;width:6px;height:10px;border-radius:50%;background:var(--line)}
.mascot i:nth-child(1){left:12px}
.mascot i:nth-child(2){right:12px}
.mascot::after{content:"";position:absolute;left:50%;bottom:9px;width:14px;height:7px;margin-left:-7px;border-bottom:3px solid var(--line);border-radius:0 0 14px 14px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.mascot,.reward .big{animation:none}}

.pellets{height:14px;margin:14px 0 8px;background:
  radial-gradient(circle,var(--pink) 4px,transparent 4.6px) 0 50%/48px 14px repeat-x,
  radial-gradient(circle,var(--mint) 4px,transparent 4.6px) 16px 50%/48px 14px repeat-x,
  radial-gradient(circle,var(--sky) 4px,transparent 4.6px) 32px 50%/48px 14px repeat-x}
.sub{margin:4px 0 14px;color:var(--dim);text-wrap:pretty}
.sub b{color:var(--ink)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .sub{margin-bottom:10px}

button{
  font:inherit;font-family:var(--font-display);color:var(--ink);background:var(--card);
  border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);
  padding:8px 16px;min-height:48px;cursor:pointer;
  transition:transform .08s,box-shadow .08s;
}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 var(--line)}
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tabs button{flex:1;font-size:.95rem;line-height:1.35}
.tabs button.on{background:var(--sky);color:var(--on-accent)}
.go{background:var(--sun);color:var(--on-accent)}
.snd{min-height:40px;padding:2px 14px;font-size:.9rem;border-radius:99px;color:var(--dim);box-shadow:0 3px 0 var(--line)}
.snd[aria-pressed="true"]{background:var(--mint);color:var(--on-accent)}

.maze{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:12px;padding:16px;border:3px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 6px 0 var(--line)}
.maze button{position:relative;aspect-ratio:1;min-height:0;padding:0;border-radius:50%;font-size:1.05rem;line-height:1}
.maze button.done{background:var(--sun);color:var(--on-accent)}
.maze button.done::after{content:"✓";position:absolute;top:-6px;right:-6px;width:22px;height:22px;display:grid;place-items:center;border:2px solid var(--line);border-radius:50%;background:var(--mint);color:var(--on-accent);font-size:.8rem;font-family:var(--font-body);font-weight:700}
.maze .gh{grid-column:1/-1;font-family:var(--font-head,inherit);font-weight:700;font-size:.95rem;color:var(--ink,inherit);padding:4px 2px 0;border-bottom:2px dashed var(--line)}
.maze .gh:first-child{padding-top:0}
.maze button.cur{outline:4px solid var(--sky);outline-offset:3px}
.maze button.bad{background:var(--pink);color:var(--on-accent)}

.card{margin-top:18px;padding:18px;border:3px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--line)}
.card[hidden]{display:none}
.card h3{display:inline-block;margin:14px 0 4px;padding:0 12px;border-radius:99px;background:var(--mint);color:var(--on-accent);font-family:var(--font-display);font-size:.85rem;font-weight:400;letter-spacing:.08em;line-height:1.7}
.card p{margin:0}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--font-display);font-size:1.3rem;color:var(--ink)}
.tag{display:inline-block;padding:0 12px;border-radius:99px;border:2px solid var(--line);background:var(--pink);color:var(--on-accent);font-weight:700;font-size:.9rem}
.ans{display:inline;font-family:var(--font-display);font-size:1.4rem;line-height:1.9;text-decoration:underline;text-decoration-color:var(--sun);text-decoration-thickness:6px;text-underline-offset:4px;text-decoration-skip-ink:none}
.ck{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;border:3px dashed var(--line);border-radius:16px;background:var(--ok-bg);cursor:pointer}
.ck input{width:24px;height:24px;accent-color:var(--pink);flex:none}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.dots{display:flex;gap:8px;margin-bottom:12px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dots i.g{background:var(--sun)}
.dots i.r{background:var(--pink)}
.dots i.c{background:var(--sky)}
.stem{margin:12px 0 0;font-size:1.15rem;text-wrap:pretty}
.opt{display:block;width:100%;margin-top:12px;text-align:left;font-size:1.05rem;line-height:1.5;padding:10px 16px}
.opt.ok{background:var(--ok-bg)}
.opt.no{background:var(--no-bg)}
.fi{width:100%;margin-top:12px;padding:12px 14px;font:inherit;color:var(--ink);background:var(--input-bg);border:3px solid var(--line);border-radius:14px}
.fb{margin-top:14px}
.good{color:var(--good);font-weight:700}
.miss{color:var(--miss);font-weight:700}
.reward{text-align:center;background:var(--sun);color:var(--on-accent)}
.reward .big{display:inline-block;font-family:var(--font-display);font-size:2.2rem;line-height:1.3;animation:pop .6s ease-out}
.date{font-family:var(--font-display);font-size:.85rem;color:var(--on-accent)}
.hide{display:none}
textarea.fi{display:block;resize:vertical;line-height:1.6;min-height:5.5rem}
.hint{display:block;margin-top:2px;color:var(--dim);font-size:.9rem}
.tag.star{background:var(--sun)}
.optn{list-style:none;margin:6px 0 0;padding:0}
.optn li{display:flex;gap:10px;padding:8px 10px;margin-top:6px;border-radius:12px;line-height:1.5;border:2px solid var(--line)}
.optn li.ok{background:var(--ok-bg)}
.optn li.no{background:transparent}
.optn li b{flex:0 0 1.6em;text-align:center}
.optn li.ok b::after{content:" ✔"}
.trbox summary{cursor:pointer;font-weight:700}
.trt{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:.95rem;line-height:1.6}
.trt td{vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line);width:50%}
.callout{margin-top:14px;padding:12px 14px;border:3px dashed var(--line);border-radius:16px;background:var(--no-bg)}
.maze button.key::before{content:"★";position:absolute;top:-7px;left:-5px;width:22px;height:22px;display:grid;place-items:center;border:2px solid var(--line);border-radius:50%;background:var(--sun);color:var(--on-accent);font-size:.75rem;font-family:var(--font-body)}
select.fi{display:block;width:auto;max-width:100%;margin-top:4px;font-family:var(--font-display);appearance:auto}
.card p,.stem{white-space:pre-line}
.exam{min-width:0;flex:1 1 220px}
.examTitle{margin:0 0 6px;color:var(--ink);font-weight:700}
.pick[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px}
.chip{min-height:40px;padding:2px 14px;font-size:.9rem;line-height:1.4;border-radius:99px;box-shadow:0 3px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--pink);color:var(--on-accent)}
.card[hidden]{display:none}
</style>

<div class="w">
  <h1><span class="mascot" aria-hidden="true"><i></i><i></i></span>國文小精靈</h1>
  <div class="pellets" aria-hidden="true"></div>

  <div class="top">
    <div class="exam">
      <p class="sub examTitle" id="examTitle"></p>
      <div class="pick" id="pickWrap" hidden>
        <label class="hint" for="examSel">換一次考卷</label>
        <select id="examSel" class="fi sel"></select>
      </div>
    </div>
    <button type="button" class="snd" id="snd" aria-pressed="true">音效：開</button>
  </div>

  <section class="card" id="lockCard" hidden>
    <h3>🔒 這一課還沒開放</h3>
    <p class="hint">考完後，老師會在課堂上告訴大家解鎖碼（6 位數）。</p>
    <label class="hint" for="code">解鎖碼</label>
    <input id="code" class="fi" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" style="max-width:9rem;letter-spacing:.3em;text-align:center">
    <div class="row"><button type="button" class="go" id="openBtn">打開</button></div>
    <p class="bad" id="lockMsg" role="status"></p>
  </section>

  <div class="tabs" id="tabsBar">
    <button type="button" id="t1" class="on">第一關　找出盲點</button>
    <button type="button" id="t2" disabled>第二關　進階破關</button>
  </div>

  <section id="s1">
    <p class="sub">點開你答錯的題號，先對答案，再想想自己當初的盲點在哪裡（選填，不寫也可以）。有 ★ 的是重點題，老師會帶大家一起檢討。已訂正：<b id="cnt">0</b> 題</p>
    <details class="card trbox" id="trBox" hidden><summary>📖 文言翻譯（原文與白話對照）</summary><div id="trBody"></div></details>
    <div class="maze" id="maze"></div>
    <div class="card" id="det" hidden></div>
    <div class="card" id="sumCard" hidden>
      <h3>傳給老師（選填）</h3>
      <p class="hint">你寫的盲點只存在自己的手機或平板，不會自動送出。想讓老師知道，可以產生整理後貼給老師。</p>
      <label class="hint" for="who">座號或暱稱（選填）</label>
      <input id="who" class="fi" type="text" autocomplete="off">
      <div class="row"><button type="button" class="go" id="mkSum">產生並複製</button></div>
      <textarea id="sumOut" class="fi" rows="7" readonly hidden></textarea>
      <p class="good" id="sumMsg"></p>
    </div>
    <div class="row"><button type="button" class="go" id="unlock" disabled>我訂正完了，前往第二關</button></div>
  </section>

  <section id="s2" class="hide">
    <p class="sub">點選這次<b>答錯</b>的題號（可多選），小精靈會把這些題改編成是非、填充或找主語，最多 10 題。全部答對就通關。</p>
    <div class="maze" id="maze2"></div>
    <div class="row"><button type="button" class="go" id="start" disabled>開始進階破關</button></div>
    <div id="quiz"></div>
  </section>

<script>
/* 版面與遊戲程式。考卷內容全部放在上面的 exam-data，換考卷只改那一段。 */
const DATA=JSON.parse(document.getElementById("exam-data").textContent);
const EXAMS=DATA.exams||[];
const CFG=Object.assign({total:10,reward:"請截圖這個畫面，向老師兌換點心一份。",blind:["粗心，看錯或漏看","沒讀懂題意或文意","字詞意思不熟","文言文翻錯","兩個選項猶豫不決","其他"]},DATA.config||{});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).replace(/[\s　]/g,"");
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

/* ---------- 音效（瀏覽器內建合成，不需要音檔） ---------- */
let soundOn=store.get("sprite-snd")!=="off",ac=null;
function audio(){
  if(!ac){
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    try{ac=new C()}catch(e){return null}
  }
  if(ac.state==="suspended")ac.resume();
  return ac;
}
function tone(f,t0,d,type,v){
  if(!soundOn)return;
  const c=audio();
  if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type||"square";o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v||0.12,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);
  o.start(t);o.stop(t+d+0.02);
}
const sfx={
  blip:()=>tone(660,0,.07),
  up:()=>{tone(392,0,.09);tone(523,.09,.09);tone(784,.18,.14)},
  ok:()=>{tone(659,0,.09);tone(988,.09,.18)},
  no:()=>{tone(220,0,.16,"sawtooth",.1);tone(165,.14,.28,"sawtooth",.1)},
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.11,i===6?.55:.14))},
  over:()=>{tone(392,0,.14,"triangle",.14);tone(330,.14,.14,"triangle",.14);tone(262,.28,.32,"triangle",.14)}
};

/* ---------- 目前這份考卷與學生的作答狀態 ---------- */
let X=null,Q=[],B=[],TYPES={};
let fixed=new Set(),shown=new Set(),blind={},talk={},bad=new Set();
let cur=-1,qs=[],k=0,res=[];
const stateKey=()=>"sprite:"+X.id;
function loadState(){
  fixed=new Set();shown=new Set();blind={};talk={};
  const raw=store.get(stateKey());
  if(!raw)return;
  try{
    const o=JSON.parse(raw);
    fixed=new Set(o.fixed||[]);shown=new Set(o.shown||[]);
    blind=o.blind||{};talk=o.talk||{};
  }catch(e){}
}
function saveState(){
  store.set(stateKey(),JSON.stringify({fixed:[...fixed],shown:[...shown],blind,talk}));
}
function typeInfo(t){
  const o=TYPES[t]||{};
  return {name:o.name||t,tip:o.tip||""};
}

/* ---------- 頁籤 ---------- */
function showTab(n){
  $("#s1").classList.toggle("hide",n!==1);
  $("#s2").classList.toggle("hide",n!==2);
  $("#t1").classList.toggle("on",n===1);
  $("#t2").classList.toggle("on",n===2);
}

/* ---------- 題號泡泡 ---------- */
function qn(i){const n=Q[i].n;return n!=null?n:i+1}
function qlab(i){const q=Q[i];return (q.g?q.g+" ":"")+"第"+qn(i)+"題"}
function buildMaze(el,onPick,needVariant){
  el.innerHTML="";
  let lastG=null;
  Q.forEach((q,i)=>{
    if(q.g&&q.g!==lastG){
      const h=document.createElement("div");h.className="gh";h.textContent=q.g;el.appendChild(h);lastG=q.g;
    }
    const b=document.createElement("button");
    b.type="button";b.textContent=qn(i);b.dataset.i=i;
    b.setAttribute("aria-label",qlab(i)+(q.key?"（重點題）":""));
    if(q.key)b.classList.add("key");
    if(needVariant&&!B[i]){b.disabled=true;b.title="這題沒有改編題"}
    b.addEventListener("click",()=>onPick(i,b));
    el.appendChild(b);
  });
}
function paint(){
  document.querySelectorAll("#maze button").forEach(b=>{
    const i=+b.dataset.i;
    b.className=(Q[i].key?"key ":"")+(fixed.has(i)?"done ":"")+(i===cur?"cur":"");
  });
  $("#cnt").textContent=fixed.size;
  $("#unlock").disabled=fixed.size<1;
}

/* ---------- 第一關：自己解析，再對答案 ---------- */
function optsHtml(q){
  if(!q.o||!q.o.length)return "";
  return `<h3>各選項解析</h3><ul class="optn">`+q.o.map((t,j)=>{
    const ok=t.charAt(0)==="✔";
    return `<li class="${ok?"ok":"no"}"><b>${"ABCD".charAt(j)}</b><span>${esc(t.replace(/^[✔✘]\s*/,""))}</span></li>`;
  }).join("")+`</ul>`;
}
function buildTr(){
  const box=$("#trBox"),body=$("#trBody");
  const tr=(X&&X.tr)||[];
  box.hidden=!tr.length;box.open=false;
  body.innerHTML=tr.map(t=>`<h3>${esc(t[0])}</h3><table class="trt"><tbody>`+t[1].map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")+`</tbody></table>`).join("");
}
function blindOf(i){return blind[i]||(blind[i]={c:"",n:""})}
function renderDet(i){
  const q=Q[i],ti=typeInfo(q.t);
  const open=shown.has(i);
  const d=$("#det");
  d.hidden=false;
  let h=`<div class="head"><span class="qn">${q.g?esc(q.g)+" "+qn(i):"Q"+qn(i)}</span><span class="tag">${esc(ti.name)}</span>${q.key?'<span class="tag star">★ 重點題</span>':""}</div>`+
    `<h3>題目重點</h3><p>${esc(q.p)}</p>`;
  if(!open){
    h+=`<p class="hint" style="margin-top:12px">先回想一下自己當時怎麼想，再按「對答案」。</p><div class="row"><button type="button" class="go" id="rv">對答案</button></div>`;
  }else{
    h+=`<h3>答案</h3><p><span class="ans">${esc(q.a)}</span></p>`+
      `<h3>我當初的盲點是什麼？</h3><p class="hint">選填，不寫也可以。想一想，當時為什麼會錯？</p>`+
      `<div class="chips" id="chips" role="group" aria-label="我當初的盲點"></div>`+
      `<label class="hint" for="bn">想補充的話（選填）</label>`+
      `<textarea id="bn" class="fi" rows="2" placeholder="例如：我以為這句是在說…"></textarea>`;
    if(q.key){
      h+=`<div class="callout">這是重點題，詳解留到課堂，老師會帶大家一起檢討。討論完，把新發現補在下面。</div>`+optsHtml(q)+
        `<h3>討論後的補充</h3><label class="hint" for="talk">老師講完，我多學到的是…</label><textarea id="talk" class="fi" rows="3"></textarea>`;
    }else{
      h+=`<h3>參考詳解</h3><p>${esc(q.e)}</p>`+optsHtml(q)+(ti.tip?`<h3>破關方法</h3><p>${esc(ti.tip)}</p>`:"");
    }
    h+=`<label class="ck" for="fx"><input type="checkbox" id="fx" ${fixed.has(i)?"checked":""}>我已經訂正在紙本考卷上了</label>`;
  }
  d.innerHTML=h;
  const rv=$("#rv");
  if(rv)rv.addEventListener("click",()=>{shown.add(i);saveState();sfx.blip();renderDet(i)});
  if(open){
    const box=$("#chips"),bl=blindOf(i);
    CFG.blind.forEach(label=>{
      const c=document.createElement("button");
      c.type="button";c.className="chip";c.textContent=label;
      c.setAttribute("aria-pressed",bl.c===label);
      c.addEventListener("click",()=>{
        bl.c=bl.c===label?"":label;
        box.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.textContent===bl.c));
        saveState();updSum();
      });
      box.appendChild(c);
    });
    const bn=$("#bn");
    bn.value=bl.n||"";
    bn.addEventListener("input",()=>{bl.n=bn.value;saveState();updSum()});
    const tk=$("#talk");
    if(tk){tk.value=talk[i]||"";tk.addEventListener("input",()=>{talk[i]=tk.value;saveState()})}
    $("#fx").addEventListener("change",ev=>{
      if(ev.target.checked){fixed.add(i);sfx.ok()}else fixed.delete(i);
      saveState();paint();
    });
  }
}

/* 學生自願傳給老師的盲點整理（不會自動送出，只存在自己的裝置） */
function blindEntries(){
  return Q.map((q,i)=>({i,q,b:blind[i]})).filter(x=>x.b&&(x.b.c||(x.b.n||"").trim()));
}
function updSum(){
  $("#sumCard").hidden=!blindEntries().length;
}
function buildSummary(){
  const who=$("#who").value.trim();
  const rows=blindEntries();
  const count={};
  let t="【"+X.title+"】盲點整理"+(who?"　"+who:"")+"\n";
  rows.forEach(({i,q,b})=>{
    t+="\n"+(q.g?q.g+" 第"+qn(i)+"題":"Q"+qn(i))+"（"+typeInfo(q.t).name+(q.key?"，重點題":"")+"）";
    if(b.c){t+="\n盲點："+b.c;count[b.c]=(count[b.c]||0)+1}
    if((b.n||"").trim())t+="\n補充："+b.n.trim();
    t+="\n";
  });
  const stat=Object.keys(count).map(k=>k+" "+count[k]+" 題").join("、");
  if(stat)t+="\n盲點統計："+stat;
  return t.trim();
}

function pickFirst(i){
  cur=i;renderDet(i);paint();
  $("#det").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function togglePick(i,b){
  bad.has(i)?bad.delete(i):bad.add(i);
  b.classList.toggle("bad",bad.has(i));
  b.setAttribute("aria-pressed",bad.has(i));
  $("#start").disabled=!bad.size;
}

/* ---------- 第二關：改編題 ---------- */
function dots(){
  return `<div class="dots" aria-hidden="true">${qs.map((_,i)=>`<i class="${i<res.length?(res[i]?"g":"r"):i===k?"c":""}"></i>`).join("")}</div>`;
}
function startQuiz(){
  const avail=Q.map((_,i)=>i).filter(i=>B[i]);
  const total=Math.min(CFG.total,avail.length);
  if(!total){$("#quiz").innerHTML=`<div class="card">這份考卷還沒有改編題。</div>`;return}
  let pick=shuf([...bad].filter(i=>B[i])).slice(0,total);
  if(pick.length<total){
    const types=new Set([...bad].map(i=>Q[i].t));
    const rest=shuf(avail.filter(i=>!pick.includes(i)))
      .sort((a,b)=>(types.has(Q[b].t)?1:0)-(types.has(Q[a].t)?1:0));
    pick=pick.concat(rest.slice(0,total-pick.length));
  }
  qs=shuf(pick).map(i=>({i,it:B[i]}));
  k=0;res=[];
  sfx.up();
  ask();
}
function fin(ok,shownAns,note){
  res[k]=ok;
  ok?sfx.ok():sfx.no();
  document.querySelectorAll("#quiz .opt,#quiz #ck,#quiz #fi").forEach(x=>x.disabled=true);
  $("#fb").innerHTML=
    `<p class="${ok?"good":"miss"}">${ok?"吃到豆子了，答對！":"被鬼抓到了，正確答案："+esc(shownAns)}</p>`+
    (note?`<p>${esc(note)}</p>`:"")+
    `<div class="row"><button type="button" class="go" id="nx">${k+1<qs.length?"下一關":"看結果"}</button></div>`;
  const nx=$("#nx");
  nx.addEventListener("click",()=>{k++;k<qs.length?ask():end()});
  nx.focus();
}
function ask(){
  const {i,it}=qs[k],kind=it.k;
  const label={t:"是非題",f:"填充題",s:"找主語"}[kind]||"題目";
  let h="";
  if(kind==="t")h=`<p class="stem">${esc(it.s)}</p><button type="button" class="opt" data-v="1">正確</button><button type="button" class="opt" data-v="0">錯誤</button>`;
  if(kind==="f")h=`<p class="stem">${esc(it.s)}</p><input id="fi" class="fi" type="text" autocomplete="off" placeholder="輸入答案"><div class="row"><button type="button" class="go" id="ck">送出</button></div>`;
  if(kind==="s")h=`<p class="stem">${esc(it.s)}</p>`+shuf([it.a,...(it.d||[])]).map(x=>`<button type="button" class="opt" data-v="${esc(x)}">${esc(x)}</button>`).join("");
  $("#quiz").innerHTML=
    `<div class="card">${dots()}<div class="head"><span class="qn">${k+1}/${qs.length}</span><span class="tag">${label}</span><span class="sub" style="margin:0">改編自${qlab(i)}</span></div>${h}<div class="fb" id="fb"></div></div>`;

  const opts=[...document.querySelectorAll("#quiz .opt")];
  const isRight=o=>kind==="t"?(o.dataset.v==="1")===!!it.v:o.dataset.v===it.a;
  opts.forEach(o=>o.addEventListener("click",()=>{
    const ok=isRight(o);
    opts.forEach(x=>{if(isRight(x))x.classList.add("ok")});
    if(!ok)o.classList.add("no");
    if(kind==="t")fin(ok,it.v?"正確":"錯誤",it.e);
    else fin(ok,it.a,it.e||"主語是「"+it.a+"」，原文把它省略了。");
  }));
  if(kind==="f"){
    const submit=()=>{
      const v=norm($("#fi").value);
      if(!v)return;
      const accepted=String(it.a).split("|").map(norm);
      fin(accepted.includes(v),String(it.a).split("|")[0],it.e||"");
    };
    $("#ck").addEventListener("click",submit);
    $("#fi").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
    $("#fi").focus();
  }
}
function end(){
  const n=res.filter(Boolean).length,all=n===qs.length;
  all?sfx.win():sfx.over();
  $("#quiz").innerHTML=all
    ?`<div class="card reward"><div class="big">通關成功！${n}／${qs.length}</div><p>全部答對，小精靈把迷宮吃光了。<br><b>${esc(CFG.reward)}</b></p><p class="date" id="dt"></p></div>`
    :`<div class="card"><b>答對 ${n}／${qs.length}</b><p>差一點就通關了。回去看看詳解，再挑戰一次。</p><div class="row"><button type="button" class="go" id="re">重新挑戰（換新題目）</button></div></div>`;
  if(all)$("#dt").textContent="兌換日期　"+new Date().toLocaleString("zh-TW")+"　"+X.title;
  else $("#re").addEventListener("click",startQuiz);
}

/* ---------- 載入一份考卷 ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openLock(e,code){
  if(!(window.crypto&&crypto.subtle))throw new Error("nocrypto");
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  let raw=null;
  for(const w of e.lock.w){
    try{
      const kk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(w.s),iterations:e.lock.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
      raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(w.iv)},kk,b64(w.ct));break;
    }catch(_){}
  }
  if(!raw)throw new Error("bad");
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.lock.iv)},key,b64(e.lock.ct));
  const o=JSON.parse(new TextDecoder().decode(pt));
  e.q=o.q;e.b=o.b;e.tr=o.tr||[];
}
function setLockUI(on){
  $("#lockCard").hidden=!on;
  $("#tabsBar").classList.toggle("hide",on);
  if(on){$("#s1").classList.add("hide");$("#s2").classList.add("hide")}
}
function relabel(){
  document.querySelectorAll("#examSel option").forEach(o=>{
    const e=EXAMS.find(x=>x.id===o.value);
    o.textContent=(e.lock&&!e.q?"🔒 ":"")+e.title;
  });
}
async function tryCode(e,code,silent){
  const msg=$("#lockMsg");
  try{
    await openLock(e,code);
    store.set("sprite-code:"+e.id,code);
    relabel();
    return true;
  }catch(err){
    if(!silent)msg.textContent=err.message==="nocrypto"?"這個瀏覽器不支援解鎖，請改用 Chrome 或 Safari 的最新版本。":"解鎖碼不對，再試一次。";
    return false;
  }
}
async function mountExam(id){
  X=EXAMS.find(e=>e.id===id)||EXAMS[0];
  if(X.lock&&!X.q){
    $("#examTitle").textContent=X.title;
    setLockUI(true);
    $("#code").value="";$("#lockMsg").textContent="";
    const saved=store.get("sprite-code:"+X.id);
    if(saved&&await tryCode(X,saved,true)){}else return;
  }
  setLockUI(false);
  Q=X.q||[];B=X.b||[];
  TYPES=Object.assign({},DATA.types||{},X.types||{});
  loadState();
  bad=new Set();cur=-1;qs=[];k=0;res=[];
  $("#examTitle").textContent=X.title;
  buildMaze($("#maze"),pickFirst,false);
  buildMaze($("#maze2"),togglePick,true);
  $("#det").hidden=true;$("#det").innerHTML="";
  $("#quiz").innerHTML="";
  $("#start").disabled=true;
  $("#t2").disabled=true;
  $("#sumOut").hidden=true;$("#sumMsg").textContent="";
  showTab(1);paint();updSum();buildTr();
}
$("#openBtn").addEventListener("click",async()=>{
  const e=X;
  if(await tryCode(e,$("#code").value.trim(),false)){sfx.up();mountExam(e.id)}else sfx.no();
});
$("#code").addEventListener("keydown",ev=>{if(ev.key==="Enter")$("#openBtn").click()});

$("#t1").addEventListener("click",()=>showTab(1));
$("#t2").addEventListener("click",()=>showTab(2));
$("#unlock").addEventListener("click",()=>{
  if(!bad.size){
    fixed.forEach(i=>{
      if(!B[i])return;
      bad.add(i);
      const b=document.querySelector(`#maze2 button[data-i="${i}"]`);
      if(b){b.classList.add("bad");b.setAttribute("aria-pressed","true")}
    });
    $("#start").disabled=!bad.size;
  }
  $("#t2").disabled=false;
  sfx.up();
  showTab(2);
});
$("#start").addEventListener("click",startQuiz);

$("#mkSum").addEventListener("click",async()=>{
  const t=buildSummary(),out=$("#sumOut");
  out.value=t;out.hidden=false;
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  if(!ok){out.focus();out.select()}
  $("#sumMsg").textContent=ok?"已複製，貼給老師就可以了。":"請長按下面的文字，選取後複製，再貼給老師。";
});

function paintSnd(){
  const b=$("#snd");
  b.textContent=soundOn?"音效：開":"音效：關";
  b.setAttribute("aria-pressed",soundOn);
}
$("#snd").addEventListener("click",()=>{
  soundOn=!soundOn;
  store.set("sprite-snd",soundOn?"on":"off");
  paintSnd();
  if(soundOn)sfx.blip();
});
paintSnd();

if(EXAMS.length){
  const sel=$("#examSel");
  EXAMS.forEach(e=>{
    const o=document.createElement("option");
    o.value=e.id;o.textContent=(e.lock&&!e.q?"🔒 ":"")+e.title;sel.appendChild(o);
  });
  const last=store.get("sprite-last");
  const start=EXAMS.some(e=>e.id===last)?last:EXAMS[0].id;
  sel.value=start;
  if(EXAMS.length>1)$("#pickWrap").hidden=false;
  sel.addEventListener("change",()=>{store.set("sprite-last",sel.value);mountExam(sel.value)});
  mountExam(start);
}else{
  $("#examTitle").textContent="老師還沒有放入考卷。";
}
</script>
